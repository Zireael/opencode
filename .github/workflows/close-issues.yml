name: close-issues

on:
  # Automatic triggers (push / pull_request / schedule / release /
  # workflow_run / ...) were removed on 2026-10-31. This workflow now
  # runs only when started by hand: Actions tab -> Run workflow, or
  # `gh workflow run <file>`.
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun script/github/close-issues.ts
