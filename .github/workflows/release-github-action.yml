name: release-github-action

on:
  # Automatic triggers (push / pull_request / schedule / release /
  # workflow_run / ...) were removed on 2026-10-31. This workflow now
  # runs only when started by hand: Actions tab -> Run workflow, or
  # `gh workflow run <file>`.
  workflow_dispatch:
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Release
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"
          ./github/script/release
